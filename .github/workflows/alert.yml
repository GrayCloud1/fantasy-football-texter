name: Fantasy Football Breaking News Alert

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a one-off test text instead of checking for real news"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write  # needed so the workflow can commit state.json back

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run alert script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: python3 fantasy_alert.py

      - name: Commit updated state.json
        run: |
          git config user.name "fantasy-alert-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state"
          git push
