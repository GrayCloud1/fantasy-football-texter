name: Fantasy Football Breaking News Alert

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a one-off test notification instead of checking for real news"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run alert script
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: python3 fantasy_alert.py

      - name: Commit updated state.json
        run: |
          git config user.name "fantasy-alert-bot"
          git config user.email "actions@github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --quiet --cached; then
              git commit -m "update state"
              git fetch origin main
              git rebase -X ours origin/main || git rebase --abort
              git push origin main
            fi
          else
            echo "state.json not present (likely a test_mode run) - nothing to commit."
          fi
