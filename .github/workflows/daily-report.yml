name: Fantasy Football Daily Standouts Report

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run daily report script
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 daily_report.py

      - name: Commit updated daily_state.json
        run: |
          git config user.name "fantasy-alert-bot"
          git config user.email "actions@github.com"
          if [ -f daily_state.json ]; then
            git add daily_state.json
            if ! git diff --quiet --cached; then
              git commit -m "update daily state"
              git fetch origin main
              git rebase -X theirs origin/main || git rebase --abort
              git push origin main
            fi
          fi
